menu=function(){state='menu';aim=false;$('prosub').textContent='';let rk=rank(),count=achievements.filter(a=>profile[a[1]]>=a[2]).length;let body='';if(tab===0){body=`<div class=opts><label>作戦<select id=mode>${option(modes,mode)}</select></label><label>戦場<select id=map>${option(maps.map(m=>m.name),mapIndex)}</select></label><label>難易度<select id=difficulty>${option(['ROOKIE','NORMAL','VETERAN','ELITE'],diff)}</select></label><label>初期武器<select id=loadout>${guns.map((w,i)=>`<option value=${i} ${i===startingGun?'selected':''} ${!unlockedGun(i)?'disabled':''}>${w.name}${!unlockedGun(i)?' / Rank '+gunReq[i]:''}</option>`).join('')}</select></label></div><div class=actionrow><button id=start class=primary>作戦開始　→</button><button id=sound>音声 ${muted?'OFF':'ON'}</button></div><div class=controlsettings><label>タッチ感度 <output id=tv>${controls.touch}%</output><input id=ts type=range min=25 max=220 step=5 value=${controls.touch}></label><label>マウス感度 <output id=mv>${controls.mouse}%</output><input id=ms type=range min=25 max=220 step=5 value=${controls.mouse}></label><label>操作方式<select id=layout><option value=auto ${controls.layout==='auto'?'selected':''}>自動</option><option value=touch ${controls.layout==='touch'?'selected':''}>タッチ</option><option value=pc ${controls.layout==='pc'?'selected':''}>PC</option></select></label><label>上下の視点<select id=vertical><option value=1 ${controls.vertical?'selected':''}>ON</option><option value=0 ${!controls.vertical?'selected':''}>OFF</option></select></label></div><p class=muteline>タッチ：左スティックで移動・右側スワイプで視点・FIREを押しながらドラッグで射撃＆照準。RUNでダッシュ。<br>PC：WASD・マウス・左クリック射撃・右クリック照準・Shiftダッシュ・R装填・Qシールド。</p>`}else if(tab===1){body=`<h2>武器庫</h2><p>階級で武器を解放。クレジットで火力・連射性能を恒久強化。</p><div class=progrid>${guns.map((w,i)=>{let v=modLevel(i),cost=65*(v+1);return `<div class="tile ${unlockedGun(i)?'':'locked'}"><b style="color:${w.col}">${w.name}</b><small>威力 ${Math.round(w.damage*(1+v*.08))}${w.pellets>1?' × '+w.pellets:''} · 装弾 ${w.cap}<br>強化 ${v}/5 · ${unlockedGun(i)?'解放済み':'Rank '+gunReq[i]+'で解放'}</small>${progress(v,5)}<button data-buy=${i} ${!unlockedGun(i)||v>=5||profile.credits<cost?'disabled':''}>${v>=5?'最大強化':'強化 / '+cost+' CR'}</button></div>`}).join('')}</div>`}else if(tab===2){body=`<h2>実績 ${count}/${achievements.length}</h2><div class=progrid>${achievements.map(([n,k,m])=>`<div class="tile ${profile[k]>=m?'done':''}"><b>${profile[k]>=m?'✓ ':''}${n}</b><small>${fmt(profile[k])} / ${fmt(m)}</small>${progress(profile[k],m)}</div>`).join('')}</div>`}else if(tab===3){body=`<h2>戦績</h2><div class=statgrid>${stat('出撃',fmt(profile.runs))}${stat('勝利',fmt(profile.wins))}${stat('累計撃破',fmt(profile.kills))}${stat('命中率',profile.shots?Math.round(profile.hits/profile.shots*100)+'%':'—')}${stat('最大連続撃破',profile.streak)}${stat('最高ウェーブ',profile.wave)}</div><div class=progrid>${Object.entries(profile.records).sort((a,b)=>b[1]-a[1]).map(([k,v])=>tileUI(k,v+' 撃破')).join('')||tileUI('記録なし','対戦を完了すると保存されます')}</div>`}else{body=`<h2>敵機ファイル</h2><div class=progrid>${[['SCOUT','高速・低耐久'],['SENTINEL','標準的な追跡・射撃'],['TITAN','高耐久・高火力'],['MARKSMAN','長距離射撃']].map(a=>tileUI(...a)).join('')}</div><h2>作戦ルール</h2><div class=progrid>${[['SKIRMISH','180秒以内に15体撃破'],['BLITZ','240秒以内に30体撃破'],['ONSLAUGHT','10ウェーブを突破'],['TIME ATTACK','90秒間の撃破数を競う']].map(a=>tileUI(...a)).join('')}</div>`}show(`<div class=prohead><div><div class=tag>LD GAMES / 02　•　TACTICAL SIMULATION</div><h1>NEON<br>ARENA 3D</h1><div class=tag>OVERDRIVE / PRO EDITION</div></div><svg class="heroart" viewBox="0 0 300 190" aria-hidden="true"><defs><linearGradient id="fa" x2="1" y2="1"><stop stop-color="#b3e6ff"/><stop offset=".5" stop-color="#426783"/><stop offset="1" stop-color="#162b46"/></linearGradient></defs><g fill="none" stroke="#85c9ff" opacity=".28"><circle cx="164" cy="91" r="80" stroke-dasharray="5 7"/><circle cx="164" cy="91" r="60"/><path d="M4 91h292M164 1v188M28 15l70 40m135 76 55 40"/></g><g transform="translate(165 95) rotate(-12)"><path d="M-76 57l12-53 37-24 54 0 37 24 12 53-35 14-82 0z" fill="url(#fa)" stroke="#9dd8f5" stroke-width="2"/><path d="M-68 20l30-15 6 33-25 19zM68 20l-30-15-6 33 25 19z" fill="#254762" stroke="#779fbe"/><path d="M-38-46l16-23h44l16 23-5 45L0 13-33-1z" fill="url(#fa)" stroke="#bbdffa" stroke-width="2"/><path d="M-32-36l64 0-8 21-48 0Z" fill="#091729"/><path d="M-25-28h50" stroke="#7eeaff" stroke-width="5"/><path d="M-17 27l17-9 17 9-4 18-26 0z" fill="#16354f" stroke="#8be3ff"/><path d="M-7 28h14v10H-7z" fill="#87e8ff"/></g><path d="M45 158h72m119-127h45" stroke="#83d5ff" stroke-width="2"/></svg><span class=edition>V 2.1　/　CONTROL UPDATE</span></div><div class=statgrid>${stat('RANK',rk)}${stat('CREDITS',fmt(profile.credits))}${stat('実績',count+'/'+achievements.length)}</div><div class=tile><small>階級 EXP ${fmt(profile.xp)} / ${fmt(rk*rk*110)}</small>${progress(profile.xp-(rk-1)**2*110,(rk*rk-(rk-1)**2)*110)}</div><div class=tabs>${['出撃','武器庫','実績','戦績','敵機図鑑'].map((n,i)=>`<button data-tab=${i} class=${tab===i?'sel':''}>${n}</button>`).join('')}</div>${body}`);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=+b.dataset.tab;menu()});document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let i=+b.dataset.buy,v=modLevel(i),cost=65*(v+1);if(unlockedGun(i)&&v<5&&profile.credits>=cost){profile.credits-=cost;profile.mods[i]=v+1;store();menu()}});if($('start')){bindControls();$('start').onclick=e=>{readSettings();start();if(!mobileControls()&&e.pointerType==='mouse')lockMouse()};$('sound').onclick=()=>{readSettings();muted=!muted;store();menu()}}};
function saveControls(){try{localStorage.setItem(controlKey,JSON.stringify(controls))}catch(e){}applyControls()}function bindControls(){for(let [id,key,out] of [['ts','touch','tv'],['ms','mouse','mv']]){$(id).oninput=()=>{controls[key]=+$(id).value;$(out).textContent=controls[key]+'%';saveControls()}}$('layout').onchange=()=>{controls.layout=$('layout').value;saveControls()};$('vertical').onchange=()=>{controls.vertical=$('vertical').value==='1';saveControls()}}function readSettings(){mode=+$('mode').value;mapIndex=+$('map').value;diff=+$('difficulty').value;startingGun=+$('loadout').value}
start=function(){clearInputs();pitch=0;target=mode===1?30:15;limit=mode===1?240:mode===3?90:180;wave=1;roundShots=roundPellets=roundHits=combo=maxCombo=comboTime=shieldTime=shieldCD=roundCredits=0;pickups=[];nextPickup=8;ended=false;aim=false;oldStart();gun=unlockedGun(startingGun)?startingGun:0;hud()};
function onKill(b){combo=comboTime>0?combo+1:1;comboTime=5;maxCombo=Math.max(combo,maxCombo);roundCredits+=b.type===2?4:2;if(combo>=3)say(combo+' KILL COMBO!');else say('BOT 撃破');if(Math.random()<.19)pickups.push({x:b.x,y:b.y,t:0,life:30})}
function shield(){if(state==='play'&&shieldCD<=0){shieldTime=3;shieldCD=18;say('SHIELD ACTIVE');sound(520,.15)}}$('ability').onclick=shield;$('aim').onclick=()=>{if(state==='play')aim=!aim};
function applyDamage(n){if(shieldTime>0)n*=.2;p.hp-=n;comboTime=Math.max(0,comboTime-.2)}
function combatExtras(dt){comboTime=Math.max(0,comboTime-dt);if(!comboTime)combo=0;shieldTime=Math.max(0,shieldTime-dt);shieldCD=Math.max(0,shieldCD-dt);nextPickup-=dt;if(nextPickup<=0){for(let i=0;i<50;i++){let x=Math.floor(rnd(1,15))+.5,y=Math.floor(rnd(1,12))+.5;if(clear(x,y)&&Math.hypot(x-p.x,y-p.y)>2){pickups.push({x,y,t:Math.random()<.65?0:1,life:35});break}}nextPickup=14}for(let v of pickups){v.life-=dt;if(Math.hypot(v.x-p.x,v.y-p.y)<.42){v.life=0;if(v.t===0){p.hp=Math.min(100,p.hp+28);say('HP +28')}else{roundCredits+=10;shieldCD=0;say('SUPPLY +10 CR')}}}pickups=pickups.filter(v=>v.life>0)}
function drawWeapon(bob){let sz=Math.min(W,H)*.43, col=guns[gun].col, gx=W/2+(aim?0:sz*.35),gy=H+sz*.04+bob+(flash?13:0)+(reload?sz*.22*Math.sin(Math.PI*Math.min(1,reload/guns[gun].reload)):0);g.save();g.translate(gx,gy);g.scale(sz,sz);function poly(pts,fill,stroke){g.beginPath();pts.forEach((v,i)=>i?g.lineTo(...v):g.moveTo(...v));g.closePath();g.fillStyle=fill;g.fill();if(stroke){g.lineWidth=.006;g.strokeStyle=stroke;g.stroke()}}let long=[.86,.7,.92,.63,1,.78][gun],wide=[.18,.28,.16,.20,.12,.27][gun],metal=g.createLinearGradient(-.35,0,.35,0);metal.addColorStop(0,'#15232f');metal.addColorStop(.26,'#40576b');metal.addColorStop(.48,'#7990a2');metal.addColorStop(.54,'#25394c');metal.addColorStop(1,'#0d1925');poly([[-.50,.1],[-.45,-.16],[-.27,-.40],[-.14,-.31],[-.08,.1]],'#29394a','#527085');poly([[.5,.1],[.44,-.13],[.24,-.38],[.11,-.30],[.07,.1]],'#283746','#52697b');poly([[-.28,.10],[-.26,-.33],[-wide,-long*.62],[-wide*.6,-long],[wide*.6,-long],[wide,-long*.62],[.23,-.34],[.30,.10]],metal,'#7591a9');poly([[-wide*.62,-long],[-wide*.48,-long-.05],[wide*.48,-long-.05],[wide*.62,-long]],'#0b1520','#90a8b6');poly([[-wide*.58,-long*.95],[wide*.58,-long*.95],[wide*.82,-long*.62],[-wide*.82,-long*.62]],'#30485c','#91a6b7');g.fillStyle=col;g.shadowColor=col;g.shadowBlur=.035*sz;g.fillRect(-wide*.17,-long*.91,wide*.34,long*.30);g.shadowBlur=0;for(let i=0;i<4;i++){g.fillStyle='#0a1521';g.fillRect(-wide*.82,-long*.57+i*.035,wide*1.64,.014)}poly([[-.18,-.43],[-.18,-.20],[-.11,-.14],[.11,-.14],[.18,-.20],[.18,-.43]],'#152a3a','#658599');g.fillStyle='#0b1724';g.fillRect(-.10,-.36,.20,.12);g.fillStyle=col;g.font='bold .07px monospace';g.textAlign='center';g.fillText(String(ammo[gun]).padStart(2,'0'),0,-.275);if(gun===1){g.fillStyle='#71869b';g.fillRect(-wide*.78,-long*.9,.028,long*.23);g.fillRect(wide*.78-.028,-long*.9,.028,long*.23)}if(gun===4){poly([[-.08,-long*.68],[-.08,-long*.52],[.08,-long*.52],[.08,-long*.68]],'#122130','#7a93a6')}if(flash){g.shadowColor='#ffd474';g.shadowBlur=22;g.fillStyle='#ffbe65';g.beginPath();for(let i=0;i<16;i++){let a=i*Math.PI/8,r=i%2?.055:.19;g.lineTo(Math.cos(a)*r,-long-.06+Math.sin(a)*r)}g.closePath();g.fill();g.fillStyle='#fff6cb';g.beginPath();g.arc(0,-long-.06,.065,0,7);g.fill()}g.restore()}function drawPickups(horizon,proj){for(let v of pickups){let dx=v.x-p.x,dy=v.y-p.y,d=dx*Math.cos(p.a)+dy*Math.sin(p.a),side=-dx*Math.sin(p.a)+dy*Math.cos(p.a);if(d<.12)continue;let x=W/2+side/d*proj,sz=Math.min(70,proj/d*.26),y=horizon+proj/d*.38-sz*.5;if(x<0||x>=W||depth[Math.floor(x/2)]<d-.1)continue;g.fillStyle=v.t?'#ffdc76':'#74ffc5';g.shadowBlur=10;g.shadowColor=g.fillStyle;g.fillRect(x-sz*.5,y-sz*.5,sz,sz);g.shadowBlur=0;g.fillStyle='#17323d';g.font=`bold ${Math.max(8,sz*.7)}px sans-serif`;g.textAlign='center';g.fillText(v.t?'C':'+',x,y+sz*.24)}}
hud=function(){oldHud();$('score').textContent=mode===2?`WAVE ${wave}/10 · ${bots.length}体`:mode===3?`撃破 ${kills}`:`撃破 ${kills} / ${target}`;$('time').textContent=mode===2?mmss(clock):mmss(limit-clock);$('prosub').textContent=`${maps[mapIndex].name} · COMBO ${combo} · SHIELD ${shieldCD?shieldCD.toFixed(0)+'s':'READY'} · ACC ${roundPellets?Math.round(roundHits/roundPellets*100):0}%`;$('ability').textContent=shieldCD?'盾 '+Math.ceil(shieldCD):'SHIELD';$('ability').disabled=shieldCD>0;$('aim').textContent=aim?'AIM ON':'AIM'};
finish=function(win){if(ended)return;ended=true;state='end';fire=false;aim=false;let xp=Math.floor(kills*18+clock*.25+(win?100:0)+(mode===2?wave*12:0)),reward=Math.floor(kills*3+roundCredits+(win?40:0));profile.xp+=xp;profile.credits+=reward;profile.kills+=kills;profile.runs++;profile.wins+=win?1:0;profile.shots+=roundPellets;profile.hits+=roundHits;profile.streak=Math.max(profile.streak,maxCombo);if(mode===2)profile.wave=Math.max(profile.wave,wave);best=Math.max(best,kills);try{localStorage.setItem('ld-arena-best',best)}catch(e){}let k=maps[mapIndex].name+' / '+modes[mode]+' / '+diff;profile.records[k]=Math.max(profile.records[k]||0,kills);store();show(`<div class=tag>AFTER ACTION REPORT / ${win?'COMPLETE':'ENDED'}</div><h1>${win?'VICTORY':'DEBRIEF'}</h1><div class=statgrid>${stat('撃破',kills)}${stat('命中率',(roundPellets?Math.round(roundHits/roundPellets*100):0)+'%')}${stat('最大コンボ',maxCombo)}${stat('獲得EXP','+'+xp)}${stat('獲得CR','+'+reward)}${stat('現在Rank',rank())}</div><p>武器のアンロック・強化に反映されました。</p><div class=actionrow><button class=primary id=again>再対戦</button><button id=home>司令室</button></div>`);$('again').onclick=start;$('home').onclick=()=>{tab=0;menu()}};
pause=function(){oldPause();if(state==='pause'&&$('home'))$('home').onclick=()=>finish(false)};$('pause').onclick=pause;
menu();requestAnimationFrame(loop);
</script></body></html>
