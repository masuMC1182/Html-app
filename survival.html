'use strict';const $=id=>document.getElementById(id),c=$('c'),g=c.getContext('2d');let W,H,D;function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();let state='menu',p,en=[],shots=[],gems=[],fx=[],keys={},pointer=null,clock=0,spawn=0,last=performance.now(),kills=0,bosses=0,threshold=1,shake=0;const rnd=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);let best=0;try{best=+localStorage.getItem('ld-survivor-best')||0}catch(e){};let audio,muted=false;function beep(f=450,d=.07){if(muted||!audio)return;try{let o=audio.createOscillator(),v=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(f,audio.currentTime);v.gain.setValueAtTime(.045,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(v);v.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}function wake(){try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}}function show(html){$('panel').innerHTML=html;$('overlay').classList.remove('hidden')}function hide(){$('overlay').classList.add('hidden')}function menu(){state='menu';show(`<div class=tag>LD GAMES / 01 • SURVIVAL</div><h1>NEON<br>SURVIVORS</h1><p>無限に迫る機械の群れを突破せよ。<br>経験値を集め、武器を進化させて5分間生き残ろう。</p><p>最高撃破数：${best}</p><button class=primary id=start>出撃する</button> <button id=sound>音声 ${muted?'OFF':'ON'}</button><p>PC：WASD・矢印キー / スマホ：画面をドラッグ<br>攻撃は自動 • オフライン対応</p>`);$('start').onclick=start;$('sound').onclick=()=>{muted=!muted;menu()}}function start(){wake();p={x:0,y:0,hp:100,max:100,lvl:1,xp:0,need:7,speed:185,mag:82,gun:1,orbit:0,pulse:0,damage:1,rate:1,regen:0,tgun:0,tpulse:0,inv:0};en=[];shots=[];gems=[];fx=[];clock=0;spawn=.2;kills=0;bosses=0;threshold=1;shake=0;state='play';hide();hud()}function hud(){ $('hp').textContent=`HP ${Math.ceil(Math.max(0,p.hp))} / ${p.max}`;$('health').style.width=100*p.hp/p.max+'%';$('level').textContent=`Lv. ${p.lvl} · 武器 ${p.gun+p.orbit+p.pulse}`;$('xp').style.width=100*p.xp/p.need+'%';$('timer').textContent=`${String(Math.floor(clock/60)).padStart(2,'0')}:${String(Math.floor(clock%60)).padStart(2,'0')} / 05:00`;$('kills').textContent='撃破 '+kills}function spawnEnemy(boss=false){let a=rnd(0,Math.PI*2),r=Math.min((W/2+55)/Math.max(.02,Math.abs(Math.cos(a))),(H/2+55)/Math.max(.02,Math.abs(Math.sin(a))));let roll=Math.random()+(settings.map===1?-.05:settings.map===3?.06:0),t=boss?3:clock>35&&roll<.13?4:clock>80&&roll<.25?5:roll<.42?2:roll<.68?1:0;let base=[{hp:20,s:56,r:13,col:'#f46f91'},{hp:13,s:105,r:10,col:'#ffbd70'},{hp:62,s:39,r:21,col:'#b2a0ff'},{hp:420+clock*2,s:53,r:37,col:'#ff557c'},{hp:34,s:42,r:15,col:'#63b9ff'},{hp:85,s:87,r:17,col:'#e6d681'}][t];base.hp*=difficultyFactors[settings.diff]*(1+clock/950);base.s*=1+settings.diff*.08+(settings.map===3?.12:0);base.hp=Math.round(base.hp);en.push({x:p.x+Math.cos(a)*r,y:p.y+Math.sin(a)*r,...base,max:base.hp,t,hit:0,orb:0,cd:rnd(.7,2.5)})}function burst(x,y,col,n=9){for(let i=0;i<n;i++)fx.push({x,y,vx:rnd(-100,100),vy:rnd(-100,100),life:rnd(.15,.45),col})}function hurt(e,d){if(e.hp<=0)return;e.hp-=d;e.hit=.12;if(fx.length<320)fx.push({text:String(Math.round(d)),x:e.x+rnd(-8,8),y:e.y-e.r,vx:0,vy:-36,life:.55,col:'#eaffff'});if(e.hp<=0){kills++;if(e.t===3){bosses++;creditsRun+=30;toast("BOSS DEFEATED +30 CORE")}else if(Math.random()<.12)creditsRun++;gems.push({x:e.x,y:e.y,v:e.t===3?25:e.t===2?3:1});burst(e.x,e.y,e.col,e.t===3?35:8);beep(e.t===3?120:240,.04)}}function finish(win){state='end';best=Math.max(best,kills);try{localStorage.setItem('ld-survivor-best',best)}catch(e){}show(`<div class=tag>MISSION ${win?'COMPLETE':'FAILED'}</div><h1>${win?'VICTORY':'GAME OVER'}</h1><p>生存 ${Math.floor(clock)} 秒 · 撃破 ${kills} · ボス ${bosses}<br>レベル ${p.lvl} · 最高撃破 ${best}</p><button class=primary id=again>再挑戦</button> <button id=home>メニュー</button>`);$('again').onclick=start;$('home').onclick=menu}const upgrades=[['パルスブラスター','弾数・威力アップ','gun',()=>p.gun++],['オービットブレード','周囲を回転する刃。Lv.5で進化','orbit',()=>p.orbit++],['ショックウェーブ','周期的な範囲攻撃。Lv.5で進化','pulse',()=>p.pulse++],['パワーコア','全武器の威力 +25%','damage',()=>p.damage+=.25],['加速装置','移動速度 +20','speed',()=>p.speed+=20],['リロード','攻撃速度 +18%','rate',()=>p.rate+=.18],['装甲修復','最大HP +25・HP回復','max',()=>{p.max+=25;p.hp=Math.min(p.max,p.hp+40)}],['マグネット','経験値吸引範囲 +45','mag',()=>p.mag+=45],['自己修復','毎秒HP回復 +1','regen',()=>p.regen++]];function levelup(){p.xp-=p.need;p.lvl++;p.need=Math.floor(p.need*1.27+2);state='upgrade';beep(840,.2);let opts=upgrades.filter(u=>!['gun','orbit','pulse'].includes(u[2])||p[u[2]]<6).sort(()=>Math.random()-.5).slice(0,3);show(`<div class=tag>LEVEL ${p.lvl}</div><h2>強化を1つ選択</h2><div class=choices>${opts.map((u,i)=>`<button data-i=${i}><b>${u[0]}</b><small>${u[1]}${['gun','orbit','pulse'].includes(u[2])?` / Lv.${p[u[2]]+1}${p[u[2]]===4?' ★進化':''}`:''}</small></button>`).join('')}</div>`);document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{opts[+b.dataset.i][3]();state='play';hide();hud()})}function update(dt){clock+=dt;extraTick(dt);p.inv=Math.max(0,p.inv-dt);p.hp=Math.min(p.max,p.hp+p.regen*dt);let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),y=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(pointer){x=pointer.dx/45;y=pointer.dy/45}let len=Math.max(1,Math.hypot(x,y));p.x+=x/len*p.speed*(dashTime>0?3.1:1)*dt;p.y+=y/len*p.speed*(dashTime>0?3.1:1)*dt;spawn-=dt;if(spawn<=0){for(let i=0;i<1+Math.floor(clock/65)&&en.length<180;i++)spawnEnemy();spawn=Math.max(.21,1.12-clock/600)/difficultyFactors[settings.diff]}if(clock>=threshold*60&&(settings.mode===3||threshold*60<=duration)){spawnEnemy(true);threshold++;toast("⚠ BOSS APPROACHING");beep(110,.4)}for(let e of en){let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;let dir=e.t===4&&d<220?-0.4:1;e.slow=Math.max(0,(e.slow||0)-dt);let mult=e.slow>0?.55:1;e.x+=dx/d*e.s*dt*dir*mult;e.y+=dy/d*e.s*dt*dir*mult;e.cd-=dt;if((e.t===4||e.t===3)&&e.cd<=0&&d<6 upgrades.push(['チェインライトニング','近い敵へ連鎖雷撃','light',()=>p.light++],['ロックオンミサイル','最寄りの敵をロックオンし範囲爆発','missile',()=>p.missile++],['フロストフィールド','周囲の敵を冷却・攻撃','frost',()=>p.frost++],['反応装甲','ダメージ軽減 +5%','armor',()=>p.armor=Math.min(.55,p.armor+.05)]);
levelup=function(){p.xp-=p.need;p.lvl++;p.need=Math.floor(p.need*1.18+3);state='upgrade';beep(840,.2);let weaponKeys=['gun','orbit','pulse','light','missile','frost'];function pick(){let opts=upgrades.filter(v=>!weaponKeys.includes(v[2])||p[v[2]]<6).map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).slice(0,3).map(v=>v[1]);show(`<div class=tag>EVOLUTION / LEVEL ${p.lvl}</div><h2>能力を選択</h2><p>組み合わせで戦術を変えよう。</p><div class=choices>${opts.map((v,i)=>`<button data-i=${i}><small>${weaponKeys.includes(v[2])?'WEAPON':'PASSIVE'}</small><b>${v[0]}</b><small>${v[1]} ${weaponKeys.includes(v[2])?' / Lv.'+(p[v[2]]+1)+(p[v[2]]===4?' ★進化':''):''}</small></button>`).join('')}</div><div class=actionrow><button id=reroll ${rerolls<=0?'disabled':''}>再抽選 (${rerolls})</button></div>`);document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{let v=opts[+b.dataset.i];v[3]();if(weaponKeys.includes(v[2])&&p[v[2]]===5)toast(v[0]+' EVOLVED');state='play';hide();hud()});$('reroll').onclick=()=>{if(rerolls>0){rerolls--;pick()}}}pick()};
function extraTick(dt){dashCD=Math.max(0,dashCD-dt);dashTime=Math.max(0,dashTime-dt);for(let b of hostile){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(dist(b,p)<18&&p.inv<=0){b.life=0;p.hp-=12*difficultyFactors[settings.diff]*(1-p.armor);p.inv=.55;shake=.2}}hostile=hostile.filter(b=>b.life>0);let targets=en.filter(e=>e.hp>0).sort((a,b)=>dist(a,p)-dist(b,p));for(let k of ['light','missile','frost']){extraCD[k]-=dt;if(!p[k]||extraCD[k]>0||!targets.length)continue;let lv=p[k],e=targets[0];if(k==='light'&&dist(p,e)<420){let hit=targets.filter(t=>dist(t,p)<420).slice(0,lv>=5?lv+4:lv+1);for(let t of hit){hurt(t,(10+lv*6)*p.damage);fx.push({ring:true,x:t.x,y:t.y,r:25,life:.42,col:'#92c8ff'})}extraCD[k]=1.1/p.rate}else if(k==='missile'&&dist(p,e)<650){let radius=lv>=5?110:50+lv*6;for(let t of targets)if(dist(t,e)<radius)hurt(t,(20+lv*9)*p.damage);fx.push({ring:true,x:e.x,y:e.y,r:radius,life:.45,col:'#ffbf72'});extraCD[k]=1.9/p.rate}else if(k==='frost'){let radius=lv>=5?240:100+lv*16;for(let t of targets)if(dist(t,p)<radius){hurt(t,(8+lv*4)*p.damage);t.slow=1.2;t.x+=(t.x-p.x)*.04;t.y+=(t.y-p.y)*.04}fx.push({ring:true,x:p.x,y:p.y,r:radius,life:.45,col:'#9ce8ff'});extraCD[k]=1.25/p.rate}}extraCD.drop-=dt;if(extraCD.drop<=0){let a=rnd(0,6.28);drops.push({x:p.x+Math.cos(a)*rnd(140,240),y:p.y+Math.sin(a)*rnd(140,240),t:Math.floor(rnd(0,3)),life:45});extraCD.drop=settings.map===2?12:20}for(let b of drops){b.life-=dt;if(dist(b,p)<23){b.life=0;if(b.t===0){p.hp=Math.min(p.max,p.hp+35);toast('HP +35')}else if(b.t===1){creditsRun+=10;toast('CORE +10')}else{for(let q of gems)p.xp+=q.v;gems=[];toast('XP MAGNET')}}}drops=drops.filter(b=>b.life>0)}
function drawTerrain(px,py){let ix=Math.floor((px-W/2)/192),iy=Math.floor((py-H/2)/192);for(let y=iy;y<iy+H/192+2;y++)for(let x=ix;x<ix+W/192+2;x++){let z=Math.sin(x*127.1+y*311.7)*43758.5453,zf=z-Math.floor(z);if(zf<.4)continue;let ax=x*192+96,ay=y*192+96;g.save();g.translate(ax,ay);g.strokeStyle=palettes[settings.map][1];g.fillStyle='#080e1c55';g.lineWidth=2;if(zf<.75){g.beginPath();g.moveTo(-28,-20);g.lineTo(14,-20);g.lineTo(29,-5);g.lineTo(29,20);g.lineTo(-28,20);g.closePath();g.fill();g.stroke();g.fillStyle=palettes[settings.map][1];g.fillRect(-20,-8,18,3);g.fillRect(-20,2,32,2)}else{g.beginPath();g.arc(0,0,28,0,Math.PI*2);g.stroke();g.beginPath();g.arc(0,0,20,0,Math.PI*2);g.stroke();g.font='10px monospace';g.textAlign='center';g.fillStyle=palettes[settings.map][1];g.fillText('0'+Math.floor(zf*10),0,4)}g.restore()}}function extraDraw(){for(let b of hostile){g.fillStyle='#ff8e82';g.shadowBlur=8;g.shadowColor='#ff5c7b';g.beginPath();g.arc(b.x,b.y,5,0,7);g.fill();g.shadowBlur=0}for(let b of drops){g.save();g.translate(b.x,b.y);g.fillStyle=['#63f3a4','#ffce78','#8db6ff'][b.t];g.strokeStyle='#ffffff88';g.lineWidth=2;g.fillRect(-11,-11,22,22);g.strokeRect(-11,-11,22,22);g.fillStyle='#152236';g.font='bold 15px sans-serif';g.textAlign='center';g.fillText(['+','C','X'][b.t],0,5);g.restore()}}
finish=function(win){if(runFinished)return;runFinished=true;state='end';let reward=Math.floor(kills*.6+clock/8+bosses*12+creditsRun+(win?80:0));profile.credits+=reward;profile.runs++;profile.wins+=win?1:0;profile.kills+=kills;profile.bosses+=bosses;profile.time+=Math.floor(clock);profile.level=Math.max(profile.level,p.lvl);best=Math.max(best,kills);try{localStorage.setItem('ld-survivor-best',best)}catch(e){}let k=arenas[settings.map]+' / '+modes[settings.mode]+' / '+['C','N','H','X'][settings.diff];profile.records[k]=Math.max(profile.records[k]||0,kills);if(settings.mode===4){let d=new Date().toISOString().slice(0,10);profile.daily[d]=Math.max(profile.daily[d]||0,kills)}store();show(`<div class=tag>MISSION REPORT / ${win?'COMPLETE':'ENDED'}</div><h1>${win?'VICTORY':'DEBRIEF'}</h1><div class=statgrid>${stat('撃破',kills)}${stat('生存',mmss(clock))}${stat('最高Lv',p.lvl)}${stat('ボス',bosses)}${stat('獲得CORE','+'+reward)}</div><p>恒久研究・機体のアンロックに反映されました。</p><div class=actionrow><button class=primary id=again>再出撃</button><button id=home>司令室</button></div>`);$('again').onclick=start;$('home').onclick=()=>{tab=0;menu()}};
const priorPause=pause;pause=function(){priorPause();if(state==='pause'&&$('home'))$('home').onclick=()=>finish(false)};$('pause').onclick=pause;
menu();requestAnimationFrame(loop);
</script></body></html>
