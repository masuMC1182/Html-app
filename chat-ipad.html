<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>iPad P2Pチャット</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    margin: 0;
    padding: 12px;
    background: #eef2f5;
    color: #333;
  }
  .container {
    max-width: 600px;
    margin: 0 auto;
  }
  .card {
    background: #fff;
    padding: 14px;
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    margin-bottom: 12px;
  }
  .row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .row:last-child { margin-bottom: 0; }
  .id-box {
    flex: 1;
    background: #f8f9fa;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-family: monospace;
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #ccc;
    outline: none;
  }
  input[type="text"]:focus {
    border-color: #007aff;
  }
  button {
    padding: 12px 16px;
    font-size: 15px;
    font-weight: bold;
    border-radius: 8px;
    border: none;
    background: #007aff;
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  button:active {
    opacity: 0.7;
  }
  button.copy-btn {
    background: #34c759;
  }
  #messages {
    height: 360px;
    overflow-y: auto;
    padding: 10px;
    background: #f9fafb;
    border-radius: 8px;
    border: 1px solid #e5e7eb;
    margin-bottom: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg {
    padding: 10px 14px;
    border-radius: 16px;
    max-width: 78%;
    word-wrap: break-word;
    font-size: 16px;
    line-height: 1.4;
  }
  .mine {
    background: #007aff;
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .theirs {
    background: #e5e5ea;
    color: #000;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .sys {
    align-self: center;
    background: rgba(0,0,0,0.06);
    color: #666;
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 12px;
  }
</style>
</head>
<body>

<div class="container">
  <!-- 接続エリア -->
  <div class="card">
    <div style="font-size: 12px; color: #666; margin-bottom: 4px;">あなたのID（友達に教える）</div>
    <div class="row">
      <div class="id-box" id="my-id">取得中...</div>
      <button class="copy-btn" onclick="copyMyId()" id="copy-btn">コピー</button>
    </div>

    <div style="font-size: 12px; color: #666; margin: 10px 0 4px;">友達とつながる</div>
    <div class="row">
      <input type="text" id="peer-id-input" placeholder="友達のIDを貼り付け">
      <button onclick="connectToPeer()">接続</button>
    </div>
  </div>

  <!-- チャットエリア -->
  <div class="card">
    <div id="messages">
      <div class="sys">IDをコピーして友達に送ってください</div>
    </div>
    <div class="row">
      <input type="text" id="msg-input" placeholder="メッセージを入力..." onkeypress="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">送信</button>
    </div>
  </div>
</div>

<script>
  const peer = new Peer();
  let conn = null;
  let myPeerId = '';

  peer.on('open', (id) => {
    myPeerId = id;
    document.getElementById('my-id').innerText = id;
  });

  peer.on('error', (err) => {
    addSystemMessage('エラー: 通信が制限されている可能性があります (' + err.type + ')');
  });

  peer.on('connection', (connection) => {
    conn = connection;
    setupConnection();
    addSystemMessage('友達が接続しました！');
  });

  function copyMyId() {
    if (!myPeerId) return;
    navigator.clipboard.writeText(myPeerId).then(() => {
      const btn = document.getElementById('copy-btn');
      btn.innerText = '完了！';
      setTimeout(() => { btn.innerText = 'コピー'; }, 1500);
    }).catch(() => {
      alert('コピーに失敗しました。IDを長押ししてコピーしてください。');
    });
  }

  function connectToPeer() {
    const peerId = document.getElementById('peer-id-input').value.trim();
    if (!peerId) return alert('友達のIDを入力してください');
    conn = peer.connect(peerId);
    setupConnection();
  }

  function setupConnection() {
    conn.on('open', () => {
      addSystemMessage('チャットを開始できます！');
    });
    conn.on('data', (data) => {
      addMessage(data, 'theirs');
    });
    conn.on('close', () => {
      addSystemMessage('接続が切れました');
    });
  }

  function sendMessage() {
    const input = document.getElementById('msg-input');
    const msg = input.value.trim();
    if (!msg) return;
    if (!conn || !conn.open) {
      alert('まだ友達と接続されていません！');
      return;
    }

    conn.send(msg);
    addMessage(msg, 'mine');
    input.value = '';
  }

  function addMessage(text, type) {
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    div.innerText = text;
    const box = document.getElementById('messages');
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function addSystemMessage(text) {
    const div = document.createElement('div');
    div.className = 'sys';
    div.innerText = text;
    const box = document.getElementById('messages');
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }
</script>

</body>
</html>
